# One Angular build, localized under fr/ and en/ (Angular's --localize output). Caddy terminates
# TLS and proxies /fr/, /en/ and /assets/ here.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # keep Location headers relative: the public scheme/host are Caddy's business
    absolute_redirect off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        font/woff2
        image/svg+xml
        text/css
        text/plain;

    # files carrying a content hash (outputHashing: bundles, media/ fonts) can be cached for long;
    # favicon.svg and assets/ (pf-ui images) carry none
    # (quoted: nginx would read the braces of {8} as a block)
    location ~ "^/(fr|en)/(media/)?[^/]+-[A-Z0-9]{8}\.(js|css|woff2?|ttf|eot|png|svg|ico)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: deep links are served the locale's index.html
    location ~ ^/(fr|en)/ {
        add_header Cache-Control "no-cache";
        try_files $uri /$1/index.html;
    }

    # pf-ui loads its images with absolute paths (/assets/img/logo_banner.svg...), the same for
    # every locale: served from the fr build. Not hashed, hence a short cache.
    location ^~ /assets/ {
        alias /usr/share/nginx/html/fr/assets/;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        return 404;
    }
}
